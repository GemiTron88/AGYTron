<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGYTron — المخرج الذكي المباشر</title>
  <style>
    :root {
      --bg-0: #07090e;
      --bg-1: #0f1420;
      --bg-2: #161e2e;
      --border: rgba(245, 158, 11, 0.25);
      --gold: #f59e0b;
      --emerald: #10b981;
      --cyan: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top right, #1d162b 0%, var(--bg-0) 70%);
      color: var(--text);
      padding: 18px;
      line-height: 1.55;
    }
    .studio-card {
      max-width: 980px;
      margin: 0 auto;
      background: rgba(15, 20, 32, 0.95);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 16px;
    }
    .title {
      font-size: 1.2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      font-weight: 600;
    }
    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .controls-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 760px) {
      .controls-bar { grid-template-columns: 1fr; }
    }
    .control-box {
      background: var(--bg-2);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      padding: 12px;
    }
    .control-label {
      font-size: 0.78rem;
      color: #fbbf24;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    button.pill {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 9px;
      padding: 6px 11px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button.pill:hover {
      border-color: rgba(245, 158, 11, 0.45);
    }
    button.pill.active {
      background: rgba(245, 158, 11, 0.22);
      border-color: var(--gold);
      color: #fde68a;
      font-weight: 600;
    }
    .chat-viewport {
      background: #090d15;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 16px;
      min-height: 290px;
      max-height: 380px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 14px;
    }
    .msg-user {
      align-self: flex-start;
      background: rgba(245, 158, 11, 0.16);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fef3c7;
      padding: 10px 14px;
      border-radius: 14px 14px 4px 14px;
      max-width: 85%;
      font-size: 0.88rem;
    }
    .msg-ai-wrap {
      align-self: stretch;
      background: rgba(22, 30, 46, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 13px;
    }
    .thinking-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #7dd3fc;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 7px 11px;
      border-radius: 9px;
      margin-bottom: 10px;
    }
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 7px;
      margin-bottom: 10px;
    }
    .tool-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.76rem;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--muted);
      transition: all 0.25s ease;
    }
    .tool-pill.working {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      color: #bae6fd;
    }
    .tool-pill.done {
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.11);
      color: #a7f3d0;
    }
    .ai-reply-text {
      font-size: 0.88rem;
      color: var(--text);
      line-height: 1.65;
    }
    .composer {
      display: flex;
      gap: 10px;
    }
    .composer input {
      flex: 1;
      background: #090d15;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 11px;
      padding: 11px 14px;
      font-size: 0.88rem;
    }
    .composer button {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #090d15;
      font-weight: 700;
      border: none;
      border-radius: 11px;
      padding: 0 20px;
      cursor: pointer;
      font-size: 0.86rem;
    }
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="studio-card">
    <div class="header">
      <div class="title">
        <span>✦ المخرج الذكي المباشر (AGY AI Chat)</span>
      </div>
      <div class="status-dot">
        <span class="pulse"></span>
        <span id="connected-device-badge">متصل: ✦ تلقائي ذكي (جهاز Windows المحلي)</span>
      </div>
    </div>

    <div class="controls-bar">
      <div class="control-box">
        <div class="control-label">
          <span>١. اختر جهاز AGY المتصل (الشبكة المحلية أو السيرفر السحابي)</span>
          <span id="node-sub-text" style="color:var(--muted); font-weight:400;">الشبكة المحلية · استجابة فورية</span>
        </div>
        <div class="pill-row" id="nodes-row"></div>
      </div>

      <div class="control-box">
        <div class="control-label">
          <span>٢. أسلوب الإخراج وعمق الإتقان</span>
          <span id="style-sub-text" style="color:#34d399; font-weight:400;">الإخراج الاحترافي · إتقان كامل</span>
        </div>
        <div class="pill-row" id="models-row" style="margin-bottom:6px;"></div>
        <div class="pill-row" id="efforts-row"></div>
      </div>
    </div>

    <div class="chat-viewport" id="chat-viewport"></div>

    <div class="composer">
      <input
        id="chat-input"
        type="text"
        placeholder="اكتب فكرتك هنا أو اطلب أي تعديل (مثلاً: اجعل الإضاءة ذهبية دافئة وأضف موسيقى حماسية)..."
        value="صمم لي إعلان فاخر لساعة أورورا X1 مع إضاءة ذهبية وموسيقى أوركسترالية ومؤثرات صوتية"
      />
      <button id="send-btn" type="button">إرسال وتنفيذ ✦</button>
    </div>

    <div class="suggestions">
      <button class="pill" onclick="quickSend('اجعل المشهد الافتتاحي أكثر فخامة مع حركة كاميرا بطيئة حول الساعة')">✨ حركة كاميرا بطيئة وفخمة</button>
      <button class="pill" onclick="quickSend('حول الفيديو إلى ريلز عمودي سريع 9:16 مع إيقاع موسيقي حماسي')">📱 تحويل إلى ريلز عمودي حماسي</button>
      <button class="pill" onclick="quickSend('أضف مشهد مقارنة مزدوج يبرز زجاج الياقوت ومقاومة الماء')">🎬 إضافة مشهد مقارنة مزدوج</button>
    </div>
  </div>

  <script>
    const NODES = [
      { id: 'auto-best', label: '✦ تلقائي ذكي', sub: 'يختار أسرع جهاز متصل تلقائياً', resolved: 'جهاز Windows المحلي 💻' },
      { id: 'win-local', label: '💻 جهاز Windows', sub: 'متصل عبر الشبكة المحلية (LAN)', resolved: 'جهاز Windows المحلي 💻' },
      { id: 'mac-local', label: '🍎 جهاز Mac', sub: 'متصل عبر الشبكة المحلية (Apple Silicon)', resolved: 'جهاز Mac المحلي 🍎' },
      { id: 'vps-01', label: '☁️ خادم VPS 01 (الرئيسي)', sub: 'السيرفر المستضيف لـ gemitron.net', resolved: 'خادم VPS 01 (الرئيسي · gemitron.net) ☁️' },
      { id: 'vps-02', label: '🚀 خادم VPS 02 (المنفصل)', sub: 'سيرفر Linux منفصل · يتصل عبر IP أو نفق إلى VPS 01', resolved: 'خادم VPS 02 (المنفصل) 🚀' }
    ];
    const MODELS = [
      { id: 'pro', label: 'الإخراج الاحترافي ✦' },
      { id: 'flash', label: 'السرعة الذكية ⚡' },
      { id: 'opus', label: 'الإبداع السينمائي 🎬' },
      { id: 'local', label: 'الوضع المحلي 🔒' }
    ];
    const EFFORTS = [
      { id: 'low', label: 'سريع' },
      { id: 'medium', label: 'متوازن' },
      { id: 'high', label: 'عميق' },
      { id: 'max', label: 'إتقان كامل ✦' }
    ];

    const state = {
      node: 'auto-best',
      model: 'pro',
      effort: 'max'
    };

    function renderControls() {
      const nodesRow = document.getElementById('nodes-row');
      nodesRow.innerHTML = '';
      NODES.forEach(n => {
        const b = document.createElement('button');
        b.className = 'pill ' + (state.node === n.id ? 'active' : '');
        b.textContent = n.label;
        b.onclick = () => { state.node = n.id; renderControls(); };
        nodesRow.appendChild(b);
      });
      const activeNode = NODES.find(n => n.id === state.node);
      document.getElementById('node-sub-text').textContent = activeNode.sub;
      document.getElementById('connected-device-badge').textContent =
        `متصل: ${activeNode.label} (${activeNode.resolved})`;

      const modelsRow = document.getElementById('models-row');
      modelsRow.innerHTML = '';
      MODELS.forEach(m => {
        const b = document.createElement('button');
        b.className = 'pill ' + (state.model === m.id ? 'active' : '');
        b.textContent = m.label;
        b.onclick = () => { state.model = m.id; renderControls(); };
        modelsRow.appendChild(b);
      });

      const effortsRow = document.getElementById('efforts-row');
      effortsRow.innerHTML = '';
      EFFORTS.forEach(e => {
        const b = document.createElement('button');
        b.className = 'pill ' + (state.effort === e.id ? 'active' : '');
        b.textContent = e.label;
        b.onclick = () => { state.effort = e.id; renderControls(); };
        effortsRow.appendChild(b);
      });
      const activeModel = MODELS.find(m => m.id === state.model);
      const activeEffort = EFFORTS.find(e => e.id === state.effort);
      document.getElementById('style-sub-text').textContent = `${activeModel.label} · ${activeEffort.label}`;
    }

    function streamConversationTurn(userText) {
      const viewport = document.getElementById('chat-viewport');
      const activeNode = NODES.find(n => n.id === state.node);

      const userDiv = document.createElement('div');
      userDiv.className = 'msg-user';
      userDiv.textContent = userText;
      viewport.appendChild(userDiv);

      const aiWrap = document.createElement('div');
      aiWrap.className = 'msg-ai-wrap';

      const thinkingEl = document.createElement('div');
      thinkingEl.className = 'thinking-banner';
      thinkingEl.innerHTML = `<span>💭</span> <span id="think-text">جاري تخيل المشاهد وتوزيع الإضاءة عبر ${activeNode.resolved}...</span>`;
      aiWrap.appendChild(thinkingEl);

      const toolsGrid = document.createElement('div');
      toolsGrid.className = 'tools-grid';
      const steps = [
        { icon: '🎬', name: 'تصميم المشاهد والإضاءة' },
        { icon: '🎵', name: 'تأليف الموسيقى التصويرية' },
        { icon: '✨', name: 'مزامنة المؤثرات الصوتية' },
        { icon: '👁️', name: 'مراجعة وضوح الخطوط والألوان' }
      ];
      const pillEls = steps.map(s => {
        const p = document.createElement('div');
        p.className = 'tool-pill';
        p.innerHTML = `<span>${s.icon} ${s.name}</span><span class="st">...</span>`;
        toolsGrid.appendChild(p);
        return p;
      });
      aiWrap.appendChild(toolsGrid);

      const replyEl = document.createElement('div');
      replyEl.className = 'ai-reply-text';
      aiWrap.appendChild(replyEl);

      viewport.appendChild(aiWrap);
      viewport.scrollTop = viewport.scrollHeight;

      // Animate live tool progress + word-by-word chat streaming
      steps.forEach((_, idx) => {
        setTimeout(() => {
          pillEls[idx].className = 'tool-pill working';
          pillEls[idx].querySelector('.st').textContent = 'جاري العمل...';
        }, idx * 280);
        setTimeout(() => {
          pillEls[idx].className = 'tool-pill done';
          pillEls[idx].querySelector('.st').textContent = 'اكتمل ✓';
        }, idx * 280 + 240);
      });

      const fullReply = `أهلاً بك! نفذت طلبك «${userText}» عبر ${activeNode.resolved}. صممت ٣ مشاهد متتابعة بإضاءة ذهبية دافئة، ونسقت الموسيقى التصويرية والمؤثرات الصوتية مع حركة العناصر، وتأكدت من وضوح العناوين العربية. يمكنك تشغيل العرض الآن أو إخباري بأي لمسة إضافية!`;
      const words = fullReply.split(' ');

      setTimeout(() => {
        thinkingEl.innerHTML = `<span>✨</span> <span>اكتمل التفكير والتنفيذ عبر ${activeNode.resolved}</span>`;
        let i = 0;
        const timer = setInterval(() => {
          if (i < words.length) {
            replyEl.textContent += (i === 0 ? '' : ' ') + words[i];
            i++;
            viewport.scrollTop = viewport.scrollHeight;
          } else {
            clearInterval(timer);
          }
        }, 35);
      }, 1150);
    }

    function quickSend(text) {
      document.getElementById('chat-input').value = text;
      streamConversationTurn(text);
    }

    document.getElementById('send-btn').onclick = () => {
      const input = document.getElementById('chat-input');
      if (!input.value.trim()) return;
      streamConversationTurn(input.value.trim());
    };

    renderControls();
    streamConversationTurn('صمم لي إعلان فاخر لساعة أورورا X1 مع إضاءة ذهبية وموسيقى أوركسترالية ومؤثرات صوتية');
  </script>
</body>
</html>
